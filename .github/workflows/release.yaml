# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Components to release (comma-separated, leave empty for all)'
        required: false
        type: string
      bump:
        description: 'Override version bump type (leave empty to auto-detect from commits)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run release preparation
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ inputs.only }}"
          fi
          if [ -n "${{ inputs.bump }}" ]; then
            ARGS="$ARGS --bump=${{ inputs.bump }}"
          fi

          pnpm run release:prepare $ARGS

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No release-worthy changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release tags
        if: steps.check.outputs.changed == 'true'
        id: tags
        run: |
          TAGS=""
          for pkg in $(git diff --name-only -- 'packages/*/package.json'); do
            DIR=$(echo "$pkg" | cut -d/ -f2)
            VERSION=$(node -p "require('./$pkg').version")
            TAGS="$TAGS ${DIR}-v${VERSION}"
          done
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Releasing:$TAGS"

      - name: Commit and tag release
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: ${{ steps.tags.outputs.tags }}"

          for TAG in ${{ steps.tags.outputs.tags }}; do
            git tag "$TAG"
          done

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: git push origin main ${{ steps.tags.outputs.tags }}
