rules:
  capitalization-after-colon:
    version: '1'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  doc-descriptions:
    version: '1'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  em-dash:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
  inline-comments:
    version: '1'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  line-wrapping:
    version: '1'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  negative-quantifier:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
  plain-speech:
    version: '8'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  reduced-object-relative:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
  second-person:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
  sentence-case:
    version: '1'
    swept-at: 2026-09-27
    detected: false
    roots:
      - .
  so:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
  where:
    version: '1'
    swept-at: 2026-09-27
    detected: true
    roots:
      - .
