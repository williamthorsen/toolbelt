packages:
  - packages/*

# Single source for every version pinned in more than one manifest.
catalog:
  '@sindresorhus/is': 8.1.0
  esbuild: 0.28.2
  readyup: 0.44.0
  vitest: 5.0.5

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set explicitly to pin
# the policy, but exclude first-party packages so that a freshly published version is
# consumable downstream without waiting out the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
