packages:
  - packages/*

# Single source for every version pinned in more than one manifest.
catalog:
  '@sindresorhus/is': 8.1.0
  esbuild: 0.28.2
  readyup: 0.32.1
  vitest: 4.1.10

allowBuilds:
  esbuild: true
  lefthook: true

# eslint-plugin-import has no release declaring an eslint 10 peer, but it shims the removed
# APIs internally and runs under eslint 10. Clear the false unmet-peer scoped to this one edge.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '>=10'

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set explicitly to pin
# the policy, but exclude first-party packages so a freshly published version is consumable
# downstream without waiting out the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''
